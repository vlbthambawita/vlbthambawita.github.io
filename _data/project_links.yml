# Project links — add new projects here.
# Each entry supports:
#   title       : Project name (required)
#   link        : URL to the project page or repo (required)
#   icon        : FontAwesome class, e.g. "fa-solid fa-brain" (required)
#   abstract    : Short description / abstract (required)
#   status      : "active" | "completed" | "ongoing" | "archived" (optional)
#   tags        : list of keyword tags (optional)
#   logo        : image URL shown instead of the icon (optional)
#   subprojects : list of sub-projects/outputs shown inside the card (optional).
#                 Each item supports title, link, icon, kind (short label such
#                 as "Paper map" or "Benchmark"), and description.


- title: "SEARCH: Synthetic hEalthcare dAta goveRnanCe Hub"
  link: "https://ihi-search.eu/"
  logo: "https://ihi-search.eu/wp-content/themes/wr/search_files/logo.png"
  icon: "fa-solid fa-shield-halved"
  abstract: >
    SEARCH pioneers healthcare innovation by combining synthetic data generation with
    federated learning to create a secure, privacy-preserving ecosystem for healthcare
    data sharing. The project addresses GDPR compliance and enables AI-driven clinical
    decision support across cardiovascular, gastrointestinal, and gynecological diseases,
    contributing to the European Health Data Space.
  status: "active"
  tags: ["synthetic data", "federated learning", "healthcare", "privacy", "GDPR", "EU project"]
  subprojects:
    - title: "ECGBench"
      link: "https://vajira.info/ECGBench/"
      icon: "fa-solid fa-heart-pulse"
      kind: "Benchmark library"
      description: >
        A PyTorch-native library for reproducible ECG benchmarks on open PhysioNet data,
        with standardised fold splits, quality-checked metadata, and a curated index of
        64 publicly available ECG datasets.

- title: "DADAP: Digitizing and Automating the Diagnostic Psychiatric Assessment Process"
  link: "https://dadap-project.eu/"
  logo: "https://dadap-project.eu/web/wp-content/uploads/2025/02/DADAP_Logo.webp"
  icon: "fa-solid fa-brain"
  abstract: >
    DADAP transforms psychiatric diagnostics for children and adolescents by leveraging
    AI, machine learning, and digitalization to enhance screening efficiency and throughput.
    The European consortium project aims to modernize diagnostic assessment workflows in
    child and adolescent psychiatry, improving access and reducing waiting times for
    mental health evaluations.
  status: "active"
  tags: ["psychiatry", "AI", "machine learning", "youth mental health", "digital health", "EU project"]

- title: "PREMAL: Practical Encrypted Machine Learning"
  link: "https://www.simulamet.no/research/projects/practical-encrypted-machine-learning-premal"
  icon: "fa-solid fa-lock"
  abstract: >
    PREMAL uses homomorphic encryption to let data owners use external AI services on
    confidential data without giving up control of it. The decryption key is never
    shared, so the AI provider learns nothing about the data. The project works on
    reducing the computational cost of encrypted training and inference without
    sacrificing model quality, mapping the cost–accuracy trade-off for practical use
    cases. Funded by the Research Council of Norway (2026–2029), with OsloMet and Simula.
  status: "active"
  tags: ["homomorphic encryption", "privacy", "machine learning", "secure AI", "Research Council of Norway"]
  subprojects:
    - title: "PREMAL Paper Map"
      link: "https://vajira.info/PREMAL/"
      icon: "fa-solid fa-diagram-project"
      kind: "Literature map"
      description: >
        A curated map of papers on machine learning under fully homomorphic encryption,
        covering inference, training, and federated aggregation, with a summary page,
        threat model, and results for each paper.
    - title: "CKKS Alternatives Atlas"
      link: "https://vajira.info/PREMAL_Bench/index.html"
      icon: "fa-solid fa-atom"
      kind: "Scheme atlas"
      description: >
        Encryption schemes that can replace or extend CKKS for private LLM inference,
        compared by hardness assumption, SIMD support, bootstrapping, libraries, and
        post-quantum status, with a visual lesson for each scheme.
