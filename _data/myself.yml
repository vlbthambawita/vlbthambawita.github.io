focus_areas:
  - title: Generative medical imaging
    summary: Building high-fidelity synthetic datasets (GANs, diffusion, text-to-image) that address data scarcity and privacy in clinical workflows.
    keywords: [Synthetic endoscopy, DeepSynthBody, Quality assurance]
  - title: Trustworthy clinical AI
    summary: Designing explainable, auditable decision systems for ECG analysis, GI tract screening, and musculoskeletal health interventions.
    keywords: [Explainability, Robustness, Regulatory readiness]
  - title: Real-world deployments
    summary: Translating lab breakthroughs into hospital pilots through multi-institutional collaborations and agile research engineering.
