about: Vajira Thambawita is a research scientist at Simula Metropolitan, specializing in machine learning and deep learning with a focus on medical imaging and multimedia data analysis. He has contributed to advancements in medical diagnostics, including polyp detection, segmentation, and synthetic dataset generation using GANs and diffusion models. Vajira is also recognized for his work on the generalizability of AI models. With a strong focus on impactful, interdisciplinary research, he aims to develop AI-driven solutions that improve healthcare outcomes and address real-world problems.
