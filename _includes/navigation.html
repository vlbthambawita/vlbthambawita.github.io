<nav class="site-nav" aria-label="Primary navigation">
  <div class="nav-brand">
    <a href="{{ '/' | relative_url }}" class="brand-link">
      <img src="{{ site.data.myself.icon }}" alt="{{ site.data.myself.name }} logo" width="56" height="56" class="brand-mark">
      <div class="brand-text">
        <span class="brand-name">{{ site.data.myself.name }}</span>
        <span class="brand-role">{{ site.data.myself.degree }} · AI Academic Researcher</span>
      </div>
    </a>
  </div>

  <button class="nav-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false" data-nav-toggle>
    <span></span><span></span><span></span>
  </button>

  <div class="nav-links" data-nav-menu>
    {% for item in site.data.navigation %}
      {% assign is_active = page.url == item.link %}
      <a class="nav-link {% if is_active %}is-active{% endif %}"
         href="{{ item.link | relative_url }}">
        {{ item.name }}
      </a>
    {% endfor %}
  </div>
</nav>
